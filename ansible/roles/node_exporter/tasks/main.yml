- name: Create node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Check installed node_exporter version
  ansible.builtin.command: "{{ node_exporter_binary }} --version"
  register: node_exporter_installed
  changed_when: false
  failed_when: false

- name: Install node_exporter {{ node_exporter_version }}
  when: ("version " + node_exporter_version) not in (node_exporter_installed.stderr | default('') + node_exporter_installed.stdout | default(''))
  block:
    - name: Download node_exporter release and verify its checksum
      ansible.builtin.get_url:
        url: "{{ node_exporter_release_url }}/{{ node_exporter_archive }}.tar.gz"
        dest: "/tmp/{{ node_exporter_archive }}.tar.gz"
        checksum: "sha256:{{ node_exporter_release_url }}/sha256sums.txt"
        mode: "0644"

    - name: Unpack node_exporter
      ansible.builtin.unarchive:
        src: "/tmp/{{ node_exporter_archive }}.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Install node_exporter binary
      ansible.builtin.copy:
        src: "/tmp/{{ node_exporter_archive }}/node_exporter"
        dest: "{{ node_exporter_binary }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart node_exporter

- name: Write node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true

- name: Apply changes now
  ansible.builtin.meta: flush_handlers

- name: Check that metrics are served
  ansible.builtin.uri:
    url: "http://{{ node_exporter_listen }}/metrics"
    return_content: true
  register: node_exporter_metrics
  failed_when: "'node_cpu_seconds_total' not in node_exporter_metrics.content"
  retries: 5
  delay: 2
  until: node_exporter_metrics is succeeded
