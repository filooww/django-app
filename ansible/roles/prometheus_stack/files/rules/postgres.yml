groups:
  - name: postgres
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL on {{ $labels.instance }} is not responding"
          description: "postgres_exporter is running but cannot connect to the database."

      - alert: PostgresTooManyConnections
        expr: |
          sum by (instance) (pg_stat_activity_count)
            / on (instance) pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL on {{ $labels.instance }} uses more than 80% of max_connections"
          description: "{{ $value | humanizePercentage }} of max_connections are in use."
