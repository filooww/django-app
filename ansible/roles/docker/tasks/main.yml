- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add official Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: "{{ docker_arch_map[ansible_architecture] }}"
    signed_by: /etc/apt/keyrings/docker.asc
  register: docker_repo

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: "{{ docker_repo.changed }}"

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Check that Docker works
  ansible.builtin.command: docker info --format "{{ '{{' }}.ServerVersion{{ '}}' }}"
  register: docker_info
  changed_when: false

- name: Show Docker version
  ansible.builtin.debug:
    msg: "Docker {{ docker_info.stdout }}"

- name: Log in to GHCR
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ docker_ghcr_username }}"
    password: "{{ docker_ghcr_token }}"
  no_log: true
  when: docker_ghcr_token | length > 0
