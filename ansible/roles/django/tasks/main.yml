- name: Check that a concrete image tag is given
  ansible.builtin.assert:
    that:
      - django_image_tag is defined
      - django_image_tag | string | length > 0
      - django_image_tag != 'latest'
    fail_msg: "Pass the image tag: -e django_image_tag=$(git rev-parse --short=7 HEAD)"
    quiet: true

- name: Create application directory
  ansible.builtin.file:
    path: "{{ django_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Write environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ django_env_file }}"
    owner: root
    group: root
    mode: "0600"
  diff: false

- name: Read the PostgreSQL server certificate
  ansible.builtin.slurp:
    src: "{{ django_db_ca_source }}"
  delegate_to: "{{ groups['database'][0] }}"
  register: django_db_ca

- name: Trust only this certificate for database connections
  ansible.builtin.copy:
    content: "{{ django_db_ca.content | b64decode }}"
    dest: "{{ django_db_ca_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Pull image from GHCR
  community.docker.docker_image:
    name: "{{ django_image }}"
    tag: "{{ django_image_tag }}"
    source: pull

- name: Run migrations before switching the container
  ansible.builtin.command: >-
    docker run --rm
    --env-file {{ django_env_file }}
    -v {{ django_db_ca_file }}:{{ django_db_ca_in_container }}:ro
    {{ django_image }}:{{ django_image_tag }}
    python manage.py migrate --noinput
  register: django_migrate
  changed_when: "'No migrations to apply' not in django_migrate.stdout"

- name: Run Django container
  community.docker.docker_container:
    name: "{{ django_container_name }}"
    image: "{{ django_image }}:{{ django_image_tag }}"
    state: started
    restart_policy: unless-stopped
    env_file: "{{ django_env_file }}"
    volumes:
      - "{{ django_db_ca_file }}:{{ django_db_ca_in_container }}:ro"
    published_ports:
      - "{{ django_port }}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000{{ django_health_path }}').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

- name: Wait until the container is healthy
  community.docker.docker_container_info:
    name: "{{ django_container_name }}"
  register: django_container_info
  until: django_container_info.container.State.Health.Status == 'healthy'
  retries: 20
  delay: 5

- name: Check health endpoint on the server
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ django_port }}{{ django_health_path }}"
    status_code: 200
  register: django_local_health
  until: django_local_health.status == 200
  retries: 10
  delay: 3

- name: Check health endpoint through the public IP
  ansible.builtin.uri:
    url: "http://{{ public_ip }}:{{ django_port }}{{ django_health_path }}"
    status_code: 200
  delegate_to: localhost
  become: false

- name: Check the deployed version through the public IP
  ansible.builtin.uri:
    url: "http://{{ public_ip }}:{{ django_port }}/"
    return_content: true
  register: django_root
  delegate_to: localhost
  become: false
  failed_when: django_root.json.version != django_image_tag | string

- name: Show result
  ansible.builtin.debug:
    msg: "Deployed {{ django_image }}:{{ django_image_tag }} -> http://{{ public_ip }}:{{ django_port }}/ ({{ django_root.json }})"

- name: Publish the deployed version to the README badge
  ansible.builtin.command: >-
    {{ playbook_dir }}/../../scripts/put-badge.sh ec2.json ec2
    "{{ django_image_tag }} · {{ '%Y-%m-%d' | strftime }}" blue
  delegate_to: localhost
  become: false
  run_once: true
  register: django_badge
  changed_when: "'updated' in django_badge.stdout"
  failed_when: false
  when: django_badge_report | bool

- name: Show badge result
  ansible.builtin.debug:
    msg: "{{ django_badge.stdout | default(django_badge.stderr | default('skipped')) }}"
  when: django_badge_report | bool
