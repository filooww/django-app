django_dir: /opt/django
django_env_file: "{{ django_dir }}/.env"
django_container_name: django
django_port: 8000
django_health_path: /health/
django_app_name: django-aws-ec2
django_db_ca_file: "{{ django_dir }}/postgres-ca.crt"
django_db_ca_in_container: /etc/postgres-ca/ca.crt
django_db_ca_source: /etc/ssl/certs/ssl-cert-snakeoil.pem
django_db_sslmode: verify-ca
