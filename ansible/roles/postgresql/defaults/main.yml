postgresql_version: "16"
postgresql_data_mount: /var/lib/postgresql
postgresql_conf_dir: "/etc/postgresql/{{ postgresql_version }}/main"
postgresql_data_dir: "{{ postgresql_data_mount }}/{{ postgresql_version }}/main"
postgresql_listen_addresses: localhost
postgresql_shared_buffers: 128MB
postgresql_max_connections: 100
postgresql_ssl_cert_file: /etc/ssl/certs/ssl-cert-snakeoil.pem
postgresql_ssl_key_file: /etc/ssl/private/ssl-cert-snakeoil.key
