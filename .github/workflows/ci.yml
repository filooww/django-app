name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/filooww/django-app

jobs:
  ci:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: app, POSTGRES_USER: app, POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U app" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Lint
        run: pip install -r app/requirements-dev.txt && flake8

      - name: Test
        run: >
          docker run --rm --network host
          -e DJANGO_SECRET_KEY=ci -e DB_PASSWORD=test -e DB_HOST=127.0.0.1
          ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          sh -c "python manage.py makemigrations --check --dry-run && python manage.py test -v 2"

      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Login to ghcr
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker push ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
